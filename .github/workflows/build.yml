name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Susun proyek
        run: |
          mkdir -p app/src/main/java/com/adjm/mp3player app/src/main/assets
          cat > settings.gradle <<'EOF_ADJM'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ADJMMp3Player'
          include ':app'
          EOF_ADJM
          cat > build.gradle <<'EOF_ADJM'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ADJM
          cat > gradle.properties <<'EOF_ADJM'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_ADJM
          cat > app/build.gradle <<'EOF_ADJM'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.adjm.mp3player'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.adjm.mp3player'
                  minSdk 27
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_ADJM
          cat > app/src/main/AndroidManifest.xml <<'EOF_ADJM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="ADJM Mp3 Player"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_ADJM
          cat > app/src/main/java/com/adjm/mp3player/MainActivity.java <<'EOF_ADJM'
          package com.adjm.mp3player;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              private WebView web;
              private ValueCallback<Uri[]> chooser;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (chooser != null) chooser.onReceiveValue(null);
                          chooser = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("audio/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(i, "Pilih lagu"), 1);
                          } catch (Exception e) {
                              chooser = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent d) {
                  if (req == 1 && chooser != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && d != null) {
                          ClipData c = d.getClipData();
                          if (c != null) {
                              out = new Uri[c.getItemCount()];
                              for (int k = 0; k < out.length; k++) out[k] = c.getItemAt(k).getUri();
                          } else if (d.getData() != null) {
                              out = new Uri[]{d.getData()};
                          }
                      }
                      chooser.onReceiveValue(out);
                      chooser = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  moveTaskToBack(true);
              }
          }
          EOF_ADJM
          cat > app/src/main/assets/index.html <<'EOF_ADJM'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>ADJM Mp3 Player</title>
          <style>
          :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pg:#eef1f4}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#14181c;color-scheme:dark}}
          :root[data-theme="dark"]{--pg:#14181c;color-scheme:dark}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
          html,body{height:100%;margin:0;overflow:hidden}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          body{background:var(--pg);font-family:Roboto,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
          .app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden;color:#fff;
          background:linear-gradient(135deg,#2b2e31 0,#17191b 14%,#0c0d0e 50%,#17191b 86%,#2b2e31 100%);
          border:1px solid #000;box-shadow:inset 0 0 0 2px #4a4e52,inset 0 2px 6px #fff3;padding:2% 3% 2%}
          .app::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,#555,#eee 20%,#888 50%,#eee 80%,#555)}
          .bump{position:absolute;width:5px;height:11%;background:linear-gradient(90deg,#3a3d40,#111);border-radius:0 3px 3px 0;top:28%}
          .bump.l{left:0}.bump.l2{left:0;top:48%}.bump.r{right:0;border-radius:3px 0 0 3px;top:36%}
          .title{flex:0 0 8%;min-height:44px;display:flex;justify-content:center;align-items:center;gap:8px}
          .t1{font:900 26px Arial,Helvetica,sans-serif;color:#eee;-webkit-text-stroke:.5px #888;letter-spacing:1px;text-shadow:0 1px 1px #000}
          .t2{font:400 32px Arial,sans-serif;color:#39b6f0;text-shadow:0 1px 1px #000}
          .t3{font:italic 700 30px "Brush Script MT","Segoe Script",cursive;color:#eee;text-shadow:0 1px 1px #000}
          .vu{flex:0 0 13%;min-height:70px;display:flex;background:#000;margin-top:1%}
          .panel{flex:1;display:flex;gap:6px;padding:5px 7px;border-left:4px solid #0b5b8a;background:#0c0c0c}
          .bar{flex:1;display:flex;flex-direction:column;gap:3px}
          .led{flex:1;border-radius:3px;opacity:.16;transition:opacity .05s;box-shadow:inset 0 0 4px #fff8;background:#3f0;color:#3f0}
          .led:nth-child(-n+4){background:#ff0;color:#ff0}
          .led:nth-child(-n+2){background:#ff4500;color:#ff4500}
          .led.on{opacity:1;box-shadow:0 0 8px currentColor,inset 0 0 4px #fff9}
          .disp{flex:0 0 7%;min-height:40px;margin:2% 2px 0;background:#5fa3a6;border:3px solid #3d6f78;outline:2px solid #345;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
          .disp span{display:inline-block;padding:0 12px;font-size:22px;letter-spacing:.5px;margin:0 auto}
          .disp span.run{margin:0;animation:run 12s linear infinite}
          @keyframes run{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
          .seek{flex:0 0 5%;min-height:26px;display:flex;align-items:center;gap:6px;margin:1% 2px 0;font-size:14px}
          input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;margin:0}
          .seek input{flex:1;height:22px}
          .seek input::-webkit-slider-runnable-track{height:3px;background:#777;border-radius:2px}
          .seek input::-moz-range-track{height:3px;background:#777}
          .seek input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffcf80,#ff7a00 60%,#c24e00);box-shadow:0 0 6px #ff8c00cc;margin-top:-6.5px}
          .seek input::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffcf80,#ff7a00 60%,#c24e00);box-shadow:0 0 6px #ff8c00cc}
          .ctl{flex:0 0 10%;min-height:60px;display:flex;justify-content:space-around;align-items:center}
          .ctl button{background:none;border:0;padding:6px;cursor:pointer;color:#fff}
          .play{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffb869,#ff7a00 55%,#c24e00)!important;border:3px solid #ddd!important;box-shadow:0 0 10px #ff7a0099;display:grid;place-items:center;padding:0!important}
          .play svg{width:40px;height:40px}
          .ctl button svg{display:block}
          svg{display:block}
          .mix{flex:1;min-height:0;display:flex;padding:0 2px;margin-top:1%}
          .ch{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
          .sl{position:relative;flex:1;min-height:0;width:84px;max-width:84px}
          .sl::before,.sl::after{content:"";position:absolute;top:40px;bottom:14px;width:11px;border-bottom:2px solid #fff;background:linear-gradient(#fff 0 2px,transparent 2px) 0 0/100% 10% repeat-y}
          .sl::before{left:0}.sl::after{right:0}
          .sl i{position:absolute;top:2px;font:400 22px/1 Arial;font-style:normal}
          .sl i.a{left:-2px}.sl i.b{right:-2px}
          input.v{position:absolute;left:50%;margin-left:-23px;top:28px;bottom:0;width:46px;height:calc(100% - 28px);writing-mode:vertical-lr;direction:rtl;cursor:pointer;touch-action:none}
          input.v::-webkit-slider-runnable-track{width:36px;border-radius:4px;background:linear-gradient(90deg,#000,#4a4a4a 45%,#000)}
          input.v::-moz-range-track{width:36px;border-radius:4px;background:linear-gradient(90deg,#000,#4a4a4a 45%,#000)}
          input.v::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:28px;border-radius:3px;border:2px solid #fff4;background:linear-gradient(#ff3b3b 0 40%,#fff 40% 55%,#f22 55%)}
          input.v::-moz-range-thumb{width:46px;height:28px;border-radius:3px;border:2px solid #fff4;background:linear-gradient(#ff3b3b 0 40%,#fff 40% 55%,#f22 55%)}
          .lab{flex:0 0 auto;font-size:18px;margin-top:2px;letter-spacing:.5px}
          .btns{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);column-gap:4px;margin-top:3%}
          .btns>div{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 13px Arial,sans-serif;letter-spacing:1px}
          .key{width:80%;max-width:80px;height:40px;border-radius:4px;border:2px solid #000;background:linear-gradient(#c8d02a 0 14%,#6b7320 14%);box-shadow:inset 0 1px 1px #fff5;cursor:pointer;padding:0}
          .key.on{background:linear-gradient(#e8ff60 0 14%,#a4c820 14%);box-shadow:0 0 14px #cf3}
          .key.sh{background:radial-gradient(circle at 35% 25%,#ffb869,#ff7a00 60%,#c24e00);border-color:#000;display:grid;place-items:center}
          .key.sh.on{box-shadow:0 0 14px #ff7a00cc}
          .ic{font:400 22px/22px Arial;height:22px;letter-spacing:0;color:#fff}
          #pl{display:none;position:absolute;left:3%;right:3%;top:46%;bottom:128px;z-index:5;background:#0b2f44;border:2px solid #3d6f78;overflow:hidden}
          #pl.show{display:flex;flex-direction:column}
          .tabs{flex:0 0 auto;display:flex;gap:6px;padding:8px;overflow-x:auto;border-bottom:1px solid #fff3}
          .tab{flex:0 0 auto;border:1px solid #fff5;background:#14506f;color:#fff;border-radius:14px;padding:6px 12px;font-size:13px;white-space:nowrap}
          .tab.act{background:#c8d02a;color:#000;font-weight:700}
          .tab.nw{background:#3a7d3a}
          .newrow{flex:0 0 auto;display:flex;gap:6px;padding:8px;border-bottom:1px solid #fff3}
          .newrow input{flex:1;min-width:0;padding:8px;font-size:15px;border:0;border-radius:4px;-webkit-user-select:text;user-select:text}
          .newrow button,.delpl{border:0;border-radius:4px;background:#c8d02a;color:#000;font-weight:700;padding:8px 12px}
          .delpl{background:#a33;color:#fff;margin:8px;font-size:13px;flex:0 0 auto}
          .songs{flex:1;min-height:0;overflow:auto}
          .it{display:flex;align-items:center;padding:9px 10px;font-size:15px;border-bottom:1px solid #fff2;cursor:pointer;gap:8px}
          .it.cur{background:#1e6a8c;color:#ff0}
          .it b{flex:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .it u{text-decoration:none;opacity:.7;padding:0 6px}
          #pl p{margin:0;padding:14px;text-align:center;opacity:.8;font-size:14px}
          </style>
          </head>
          <body>
          <div class="app">
            <div class="bump l"></div><div class="bump l2"></div><div class="bump r"></div>
            <div class="title"><span class="t1">ADJM</span><span class="t2">Mp3</span><span class="t3">Player</span></div>
            <div class="vu" id="vu"></div>
            <div class="disp"><span id="np">----- NOW PLAYING -----</span></div>
            <div class="seek"><span id="tc">00:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="td">00:00</span></div>
            <div class="ctl">
              <button id="prev" aria-label="Sebelumnya"><svg width="64" height="48" viewBox="0 0 84 64"><rect x="8" y="8" width="5" height="48" fill="#fff"/><path d="M76 10v44L22 32z" fill="#fff"/></svg></button>
              <button id="pp" class="play" aria-label="Putar"><svg id="ppi" width="52" height="52" viewBox="0 0 52 52"><path d="M16 8v36l30-18z" fill="#fff"/></svg></button>
              <button id="next" aria-label="Berikutnya"><svg width="64" height="48" viewBox="0 0 84 64"><rect x="71" y="8" width="5" height="48" fill="#fff"/><path d="M8 10v44l54-22z" fill="#fff"/></svg></button>
            </div>
            <div class="mix">
              <div class="ch"><div class="sl"><i class="a">+</i><i class="b">+</i><input class="v" id="lv" type="range" min="0" max="100" value="80"></div><div class="lab">LEVEL</div></div>
              <div class="ch"><div class="sl"><i class="b">+</i><input class="v" id="lo" type="range" min="-12" max="12" step="0.5" value="0"></div><div class="lab">LOW</div></div>
              <div class="ch"><div class="sl"><i class="b">+</i><input class="v" id="hi" type="range" min="-12" max="12" step="0.5" value="0"></div><div class="lab">HIGH</div></div>
            </div>
            <div class="btns">
              <div><button class="key" id="add" aria-label="Tambah lagu"></button><span>FILE</span></div>
              <div><button class="key" id="pbtn" aria-label="Daftar lagu"></button><span>LIST</span></div>
              <div><button class="key sh" id="shf" aria-label="Acak"><span class="ic">⤮</span></button><span>&nbsp;</span></div>
              <div><button class="key" id="lr" aria-label="Kanal L/R"></button><span>L/R</span></div>
            </div>
            <div id="pl"></div>
            <input type="file" id="fi" accept="audio/*,.mp3" multiple hidden>
          </div>
          <script>
          const $=id=>document.getElementById(id);
          const a=new Audio();a.preload='auto';
          let ctx,an,vol,low,high,norm,kar,data,shuf=false,seeking=false,cur=-1;
          const pls=[{name:'Playlist 1',songs:[]}];let vi=0,adding=false,list=pls[0].songs;
          const held=new Array(6).fill(0);
          // LED VU: 3 panel x 2 batang x 4 LED
          const N=8;const barH='<div class="bar">'+'<div class="led"></div>'.repeat(N)+'</div>';
          $('vu').innerHTML=Array.from({length:3},()=>'<div class="panel">'+barH+barH+'</div>').join('');
          const bars=[...document.querySelectorAll('.bar')];
          function initAudio(){
            if(ctx){ctx.resume();return}
            ctx=new(window.AudioContext||window.webkitAudioContext)();
            const src=ctx.createMediaElementSource(a);
            norm=ctx.createGain();kar=ctx.createGain();kar.gain.value=0;
            const sp=ctx.createChannelSplitter(2),l=ctx.createGain(),r=ctx.createGain(),sum=ctx.createGain();
            lg=l;rg=r;l.gain.value=1;r.gain.value=0;sum.channelCount=1;sum.channelCountMode='explicit';
            src.connect(norm);src.connect(sp);sp.connect(l,0);sp.connect(r,1);l.connect(sum);r.connect(sum);sum.connect(kar);
            low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=200;
            high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=3500;
            vol=ctx.createGain();an=ctx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.5;
            norm.connect(low);kar.connect(low);low.connect(high);high.connect(vol);vol.connect(an);an.connect(ctx.destination);
            data=new Uint8Array(an.frequencyBinCount);applyAll();
          }
          function applyAll(){if(!ctx)return;vol.gain.value=Math.pow($('lv').value/100,2);low.gain.value=+$('lo').value;high.gain.value=+$('hi').value}
          ['lv','lo','hi'].forEach(i=>$(i).addEventListener('input',applyAll));
          ['lo','hi'].forEach(i=>$(i).addEventListener('dblclick',()=>{$(i).value=0;applyAll()}));
          // Loop VU
          const rng=[[1,2],[2,4],[4,8],[8,16],[16,36],[36,90]];
          function loop(){
            const playing=!a.paused&&an;
            if(playing)an.getByteFrequencyData(data);
            for(let i=0;i<6;i++){
              let v=0;
              if(playing){let s=0,n=0;for(let k=rng[i][0];k<rng[i][1];k++){s+=data[k];n++}v=Math.min(1,Math.pow(s/n/255,1.6)*1.5)}
              held[i]=Math.max(v,held[i]-.045);
              const lit=Math.round(held[i]*N);
              bars[i].querySelectorAll('.led').forEach((d,j)=>d.classList.toggle('on',(N-1-j)<lit));
            }
            requestAnimationFrame(loop);
          }
          loop();
          // Pemutar
          const fmt=t=>isFinite(t)?String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0'):'00:00';
          function setNP(t){const s=$('np');s.textContent=t;s.classList.remove('run');if(s.parentElement.clientWidth<s.scrollWidth+4)s.classList.add('run')}
          function play(i){
            if(!list.length)return;initAudio();
            cur=(i+list.length)%list.length;a.src=list[cur].url;a.play().catch(()=>{});
            setNP(list[cur].name);renderList();
          }
               function setIcon(p){$('ppi').innerHTML=p?'<rect x="12" y="9" width="9" height="34" fill="#fff"/><rect x="31" y="9" width="9" height="34" fill="#fff"/>':'<path d="M16 8v36l30-18z" fill="#fff"/>'}
          a.onplay=()=>setIcon(true);a.onpause=()=>setIcon(false);
          a.onloadedmetadata=()=>$('td').textContent=fmt(a.duration);
          a.ontimeupdate=()=>{$('tc').textContent=fmt(a.currentTime);if(!seeking&&a.duration)$('sk').value=a.currentTime/a.duration*1000};
          a.onended=()=>next();
          function next(){if(!list.length)return;play(shuf&&list.length>1?(()=>{let n;do{n=Math.floor(Math.random()*list.length)}while(n===cur);return n})():cur+1)}
          $('next').onclick=next;
          $('prev').onclick=()=>{if(a.currentTime>3)a.currentTime=0;else play(cur-1)};
          $('pp').onclick=()=>{
            if(cur<0)list=pls[vi].songs;
            if(!list.length){$('fi').click();return}
            initAudio();
            if(cur<0)play(0);else if(a.paused)a.play();else a.pause();
          };
          $('sk').addEventListener('input',()=>{seeking=true;if(a.duration)a.currentTime=$('sk').value/1000*a.duration});
          $('sk').addEventListener('change',()=>seeking=false);
          $('sk').addEventListener('pointerup',()=>seeking=false);
          $('add').onclick=()=>$('fi').click();
          $('fi').onchange=e=>{
            const sg=pls[vi].songs,first=sg.length;
            [...e.target.files].forEach(f=>sg.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));
            e.target.value='';
            if(cur<0&&sg.length>first){list=sg;play(first)}
            renderList();
          };
          $('shf').onclick=()=>{shuf=!shuf;$('shf').classList.toggle('on',shuf)};
          let lrMode=0,lg,rg;
          $('lr').onclick=()=>{
            initAudio();lrMode=(lrMode+1)%3;
            $('lr').classList.toggle('on',lrMode!==0);
            if(lrMode===0){norm.gain.value=1;kar.gain.value=0}
            else{norm.gain.value=0;kar.gain.value=1;lg.gain.value=lrMode===1?1:0;rg.gain.value=lrMode===2?1:0}
          };
          function placePl(){const A=document.querySelector('.app'),pl=$('pl');pl.style.top=document.querySelector('.mix').offsetTop+'px';pl.style.bottom=(A.clientHeight-document.querySelector('.btns').offsetTop+4)+'px'}
          $('pbtn').onclick=()=>{placePl();$('pl').classList.toggle('show');$('pbtn').classList.toggle('on',$('pl').classList.contains('show'))};
          window.addEventListener('resize',placePl);
          function stopAll(){a.pause();a.removeAttribute('src');cur=-1;setNP('----- NOW PLAYING -----');$('sk').value=0;$('tc').textContent=$('td').textContent='00:00'}
          function renderList(){
            const p=$('pl');p.innerHTML='';
            const tb=document.createElement('div');tb.className='tabs';
            pls.forEach((q,k)=>{const t=document.createElement('button');t.className='tab'+(k===vi?' act':'');t.textContent=q.name+' ('+q.songs.length+')';t.onclick=()=>{vi=k;adding=false;renderList()};tb.appendChild(t)});
            const nb=document.createElement('button');nb.className='tab nw';nb.textContent='+ Baru';nb.onclick=()=>{adding=!adding;renderList()};tb.appendChild(nb);
            p.appendChild(tb);
            if(adding){
              const r=document.createElement('div');r.className='newrow';
              r.innerHTML='<input id="nn" type="text" maxlength="24" placeholder="Nama playlist baru"><button id="ok">BUAT</button>';
              p.appendChild(r);
              const mk=()=>{const v=$('nn').value.trim()||'Playlist '+(pls.length+1);pls.push({name:v,songs:[]});vi=pls.length-1;adding=false;renderList()};
              $('ok').onclick=mk;$('nn').onkeydown=ev=>{if(ev.key==='Enter')mk()};
              setTimeout(()=>$('nn').focus(),50);
            }
            const sg=pls[vi].songs,box=document.createElement('div');box.className='songs';
            if(!sg.length)box.innerHTML='<p>Playlist kosong. Tekan tombol ☰+ untuk menambah lagu MP3 ke playlist ini.</p>';
            sg.forEach((s,i)=>{
              const d=document.createElement('div');d.className='it'+(i===cur&&sg===list?' cur':'');
              d.innerHTML='<span>'+(i+1)+'.</span><b></b><u title="Hapus">✕</u>';
              d.querySelector('b').textContent=s.name;
              d.onclick=()=>{list=sg;play(i)};
              d.querySelector('u').onclick=ev=>{
                ev.stopPropagation();URL.revokeObjectURL(s.url);sg.splice(i,1);
                if(sg===list){if(i===cur)stopAll();else if(i<cur)cur--}
                renderList();
              };
              box.appendChild(d);
            });
            p.appendChild(box);
            if(pls.length>1){
              const x=document.createElement('button');x.className='delpl';x.textContent='Hapus playlist ini';
              x.onclick=()=>{
                const q=pls[vi];if(q.songs===list)stopAll();
                q.songs.forEach(s=>URL.revokeObjectURL(s.url));
                pls.splice(vi,1);vi=Math.max(0,vi-1);
                if(cur<0)list=pls[vi].songs;
                renderList();
              };
              p.appendChild(x);
            }
          }
          renderList();
          </script>
          </body>
          </html>
          EOF_ADJM
      - name: Terima lisensi SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: adjm-mp3-player-apk
          path: app/build/outputs/apk/debug/app-debug.apk
